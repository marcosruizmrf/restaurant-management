version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: management-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: restaurant_management
      MYSQL_USER: management
      MYSQL_PASSWORD: management123
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - restaurant-management-network

  app:
    build: .
    container_name: restaurant-management-app
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/restaurant_management?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: gestao
      SPRING_DATASOURCE_PASSWORD: gestao123
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - restaurant-management-network

volumes:
  mysql_data:

networks:
  restaurant-management-network:
    driver: bridge
